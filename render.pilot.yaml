      envVarKey: STRIPE_SECRET_KEY
  - key: STRIPE_WEBHOOK_SECRET
    fromService:
      type: web
      name: scenefoundry-pilot-web
      envVarKey: STRIPE_WEBHOOK_SECRET
  - key: GOOGLE_CLIENT_ID
    fromService:
      type: web
      name: scenefoundry-pilot-web
      envVarKey: GOOGLE_CLIENT_ID
  - key: GOOGLE_CLIENT_SECRET
    fromService:
      type: web
      name: scenefoundry-pilot-web
      envVarKey: GOOGLE_CLIENT_SECRET
  - key: SECRET_KEY_BASE
    fromService:
      type: web
      name: scenefoundry-pilot-web
      envVarKey: SECRET_KEY_BASE
  - key: DATABASE_URL
    fromDatabase:
      name: scenefoundry-pilot-db
      property: connectionString
databases:
- name: scenefoundry-pilot-db
  plan: 0.1c-256mb
  diskSizeGB: 1
  storageAutoscalingEnabled: false
  region: oregon
  postgresMajorVersion: '17'
  databaseName: scenefoundry_pilot
  user: scenefoundry_pilot
  ipAllowList: []
