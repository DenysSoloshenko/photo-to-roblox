services:
  - type: web
    name: scenefoundry-roblox
    runtime: ruby
    plan: free
    region: oregon
    branch: deploy/render-free
    buildCommand: bundle install && npm ci --prefix frontend && npm run build --prefix frontend && bundle exec rails db:prepare
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scenefoundry-roblox-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RUBY_VERSION
        value: 3.3.4
      - key: NODE_VERSION
        value: 22.19.0
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: APP_URL
        value: https://scenefoundry-roblox.onrender.com
      - key: API_URL
        value: https://scenefoundry-roblox.onrender.com
      - key: APP_HOST
        value: scenefoundry-roblox.onrender.com
      - key: ADMIN_EMAILS
        value: den.solosh73@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAIL_FROM
        value: SceneFoundry <orders@scenefoundry.app>
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_DOMAIN
        value: scenefoundry-roblox.onrender.com
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_AUTHENTICATION
        value: plain
      - key: SMTP_ENABLE_STARTTLS_AUTO
        value: "true"
      - key: ACTIVE_STORAGE_SERVICE
        value: local
      - key: OPENAI_API_KEY
        sync: false
      - key: VISION_MODEL
        value: gpt-5.6-terra
      - key: VISION_REASONING_EFFORT
        value: high
      - key: VISION_REFINEMENT_ENABLED
        value: "true"
      - key: VISION_REFINEMENT_REASONING_EFFORT
        value: medium
      - key: VISION_READ_TIMEOUT_SECONDS
        value: "300"
      - key: VISION_MAX_OUTPUT_TOKENS
        value: "10000"
      - key: ASTRA_QUALITY_ENABLED
        value: "false"
      - key: ASTRA_ORDER_AUTOMATION_ENABLED
        value: "false"

databases:
  - name: scenefoundry-roblox-db
    plan: free
    region: oregon
    databaseName: scenefoundry_roblox
    user: scenefoundry_roblox
