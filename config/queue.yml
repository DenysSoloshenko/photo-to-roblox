default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 100
  workers:
    - queues: [mailers, maintenance, default, active_storage_analysis, active_storage_purge]
      threads: 2
      processes: 1
      polling_interval: 1
    - queues: [premium_generation]
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default
test:
  <<: *default
production:
  <<: *default
